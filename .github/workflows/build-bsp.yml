name: Build Gobekli Tepe BSP

on:
  workflow_dispatch:
  push:
    paths:
      - "fy_gobeklitepe_v12.map"
      - "fy_gobeklitepe.wad"
      - ".github/workflows/build-bsp.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v4

      - name: VHLT v34 indir
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/twhl-community/VHLT-V34/releases/download/V34/Vluzacn.s.ZHLT.v34.zip"
          Invoke-WebRequest -Uri $url -OutFile vhlt.zip
          Expand-Archive -LiteralPath vhlt.zip -DestinationPath vhlt -Force

      - name: Derleyicileri bul
        id: tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Find-Tool($name64, $name32) {
            $x = Get-ChildItem -Path vhlt -Recurse -File |
              Where-Object { $_.Name -ieq $name64 -or $_.Name -ieq $name32 } |
              Select-Object -First 1
            if (-not $x) { throw "Bulunamadi: $name64 / $name32" }
            return $x.FullName
          }

          $csg = Find-Tool "hlcsg_x64.exe" "hlcsg.exe"
          $bsp = Find-Tool "hlbsp_x64.exe" "hlbsp.exe"
          $vis = Find-Tool "hlvis_x64.exe" "hlvis.exe"
          $rad = Find-Tool "hlrad_x64.exe" "hlrad.exe"

          "CSG=$csg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BSP=$bsp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VIS=$vis" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RAD=$rad" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "CSG: $csg"
          Write-Host "BSP: $bsp"
          Write-Host "VIS: $vis"
          Write-Host "RAD: $rad"

      - name: MAP derle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item fy_gobeklitepe_v12.map build\
          Copy-Item fy_gobeklitepe.wad build\

          Set-Location build

          & "$env:CSG" -nowadtextures -cliptype precise fy_gobeklitepe_v12.map
          if ($LASTEXITCODE -ne 0) { throw "HLCSG hata kodu: $LASTEXITCODE" }

          & "$env:BSP" fy_gobeklitepe_v12.map
          if ($LASTEXITCODE -ne 0) { throw "HLBSP hata kodu: $LASTEXITCODE" }

          & "$env:VIS" -full fy_gobeklitepe_v12.map
          if ($LASTEXITCODE -ne 0) { throw "HLVIS hata kodu: $LASTEXITCODE" }

          & "$env:RAD" fy_gobeklitepe_v12.map
          if ($LASTEXITCODE -ne 0) { throw "HLRAD hata kodu: $LASTEXITCODE" }

          if (-not (Test-Path fy_gobeklitepe_v12.bsp)) {
            throw "BSP uretilmedi."
          }

          Get-ChildItem fy_gobeklitepe_v12.* | Format-Table Name,Length

      - name: BSP dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: fy_gobeklitepe_v12-BSP
          path: build/fy_gobeklitepe_v12.bsp
          if-no-files-found: error
