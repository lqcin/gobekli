name: Build Gobekli Tepe BSP v14

on:
  workflow_dispatch:
  push:
    paths:
      - "fy_gobeklitepe_v14.map"
      - "fy_gobeklitepe.wad"
      - ".github/workflows/build-bsp.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v4
      - name: VHLT v34 indir
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/twhl-community/VHLT-V34/releases/download/V34/Vluzacn.s.ZHLT.v34.zip" -OutFile vhlt.zip
          Expand-Archive -LiteralPath vhlt.zip -DestinationPath vhlt -Force
      - name: Derleyicileri bul
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function F($a,$b) { $x=Get-ChildItem vhlt -Recurse -File | Where-Object { $_.Name -ieq $a -or $_.Name -ieq $b } | Select-Object -First 1; if(-not $x){throw "Bulunamadi: $a"}; return $x.FullName }
          "CSG=$(F 'hlcsg_x64.exe' 'hlcsg.exe')" | Out-File $env:GITHUB_ENV -Append
          "BSP=$(F 'hlbsp_x64.exe' 'hlbsp.exe')" | Out-File $env:GITHUB_ENV -Append
          "VIS=$(F 'hlvis_x64.exe' 'hlvis.exe')" | Out-File $env:GITHUB_ENV -Append
          "RAD=$(F 'hlrad_x64.exe' 'hlrad.exe')" | Out-File $env:GITHUB_ENV -Append
      - name: MAP derle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          mkdir build -Force | Out-Null
          Copy-Item fy_gobeklitepe_v14.map build\
          Copy-Item fy_gobeklitepe.wad build\
          cd build
          & "$env:CSG" -nowadtextures -cliptype precise fy_gobeklitepe_v14.map
          if($LASTEXITCODE -ne 0){throw "HLCSG: $LASTEXITCODE"}
          & "$env:BSP" fy_gobeklitepe_v14.map
          if($LASTEXITCODE -ne 0){throw "HLBSP: $LASTEXITCODE"}
          & "$env:VIS" -full fy_gobeklitepe_v14.map
          if($LASTEXITCODE -ne 0){throw "HLVIS: $LASTEXITCODE"}
          & "$env:RAD" fy_gobeklitepe_v14.map
          if($LASTEXITCODE -ne 0){throw "HLRAD: $LASTEXITCODE"}
      - name: BSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: fy_gobeklitepe_v14-BSP
          path: build/fy_gobeklitepe_v14.bsp
          if-no-files-found: error
      - name: Debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fy_gobeklitepe_v14-build-debug
          path: |
            build/*.log
            build/*.map
            build/*.bsp
          if-no-files-found: warn
